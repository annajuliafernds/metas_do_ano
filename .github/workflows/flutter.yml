
name: Flutter CI

on:
  push:
    branches:
      - main
      - ci/github-actions
      - feat/detecta-codigo-deprecado
      - feat/padrao-codificacao
      - feat/detector-codigo-duplicado
      - feat/diagrama-classes-uml
      - feat/corrige-issues-sonarcloud
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0

      - name: Configurar Java
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9
        with:
          distribution: 'temurin'
          java-version: '17'  
      
      - name: Verificar versão do Java
        run: java -version

      - name: Configurar Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: '3.44.0'
          channel: stable

      - name: Configurar Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '20'

      - name: Instalar dependências Node.js
        run: npm ci

      - name: Instalar gerador de diagramas UML
        run: |
          dart pub global activate diagram_dart 0.4.0
          echo "$HOME/.pub-cache/bin" >> "$GITHUB_PATH"

      - name: Detectar código duplicado
        run: npm run detect-duplicates

      - name: Gerar diagrama UML
        run: npm run generate-uml

      - name: Salvar imagem UML como artefato
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: diagrama-uml
          path: docs/uml/images/metas_do_ano_uml.png
          if-no-files-found: error

      - name: Instalar dependências Flutter
        run: flutter pub get

      - name: Verificar padrões de codificação
        run: flutter analyze --fatal-infos --fatal-warnings

      - name: Detectar código depreciado
        run: |
          flutter analyze 2>&1 | tee analyze.log
          if grep -q "deprecated_member_use" analyze.log; then
            echo "Código depreciado encontrado."
            exit 1
          fi
          echo "Nenhum código depreciado encontrado."

      - name: Gerar build
        run: flutter build apk --debug

      - name: Configurar Java 21 para SonarQube
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Analisar código com SonarQube Cloud
        uses: SonarSource/sonarqube-scan-action@fd88b7d7ccbaefd23d8f36f73b59db7a3d246602
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_SCANNER_SKIP_JRE_PROVISIONING: "true"
