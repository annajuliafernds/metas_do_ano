
name: Flutter CI

on:
  push:
    branches:
      - main
      - ci/github-actions
      - feat/detecta-codigo-deprecado
      - feat/padrao-codificacao
      - feat/detector-codigo-duplicado
      - feat/diagrama-classes-uml
      - feat/detecta-code-smells
      - feat/detecta-conformidade-camadas
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verificar versão do Java
        run: java -version

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          channel: stable

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar dependências Node.js
        run: npm ci

      - name: Instalar gerador de diagramas UML
        run: |
          dart pub global activate diagram_dart 0.4.0
          echo "$HOME/.pub-cache/bin" >> "$GITHUB_PATH"

      - name: Detectar código duplicado
        run: npm run detect-duplicates

      - name: Gerar diagrama UML
        run: npm run generate-uml

      - name: Salvar imagem UML como artefato
        uses: actions/upload-artifact@v4
        with:
          name: diagrama-uml
          path: docs/uml/images/metas_do_ano_uml.png
          if-no-files-found: error

      - name: Instalar dependências Flutter
        run: flutter pub get

      - name: Verificar conformidade das camadas
        run: dart run import_lint

      - name: Detectar Code Smells com Dart Analyzer
        run: dart analyze --fatal-warnings

      - name: Verificar padrões de codificação
        run: flutter analyze --fatal-warnings --no-fatal-infos

      - name: Detectar código depreciado
        run: |
          flutter analyze 2>&1 | tee analyze.log
          if grep -q "deprecated_member_use" analyze.log; then
            echo "Código depreciado encontrado."
            exit 1
          fi
          echo "Nenhum código depreciado encontrado."

      - name: Gerar build
        run: flutter build apk --debug
