
name: Flutter CI

on:
  push:
    branches:
      - main
      - ci/github-actions
      - feat/detecta-codigo-deprecado
      - feat/padrao-codificacao
      - feat/detector-codigo-duplicado
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          channel: stable

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar dependências Node.js
        run: npm ci

      - name: Detectar código duplicado
        run: npm run detect-duplicates

      - name: Instalar dependências Flutter
        run: flutter pub get

      - name: Verificar padrões de codificação
        run: flutter analyze --fatal-infos --fatal-warnings

      - name: Detectar código depreciado
        run: |
          flutter analyze 2>&1 | tee analyze.log
          if grep -q "deprecated_member_use" analyze.log; then
            echo "Código depreciado encontrado."
            exit 1
          fi
          echo "Nenhum código depreciado encontrado."

      - name: Gerar build
        run: flutter build apk --debug
